# FU-042: pybabel extraction config.  Tells `pybabel extract` how to
# discover translatable strings inside the Python backend.
#
# Usage:
#   .venv/bin/pybabel extract -F babel.cfg -o backend_service/locales/messages.pot backend_service/
#   .venv/bin/pybabel init -i backend_service/locales/messages.pot -d backend_service/locales -l zh_CN -D messages
#   .venv/bin/pybabel update -i backend_service/locales/messages.pot -d backend_service/locales
#   .venv/bin/pybabel compile -d backend_service/locales
#
# The extractor picks up `gettext("...")` / `t("...")` / `tn(singular, plural, n)`
# call sites where `t` and `tn` are aliases bound to
# ``request.state.t`` / ``request.state.tn`` by the i18n middleware in
# ``backend_service/i18n.py``.
[python: backend_service/**.py]
keywords = t tn gettext ngettext
