[package]
name = "chaosengineai"
version = "0.9.2"
description = "ChaosEngineAI desktop shell for local AI model inference"
authors = ["OpenAI Codex"]
edition = "2021"

[[bin]]
name = "ChaosEngineAI"
path = "src/main.rs"

[lib]
name = "chaosengineai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
# FU-042 i18n: ``rust-i18n`` (MIT) loads compile-time message catalogs from
# ``src-tauri/locales/{lang}.yml`` for static native menu / tray / updater
# strings via the ``t!("menu.file")`` macro. Zero runtime cost — everything
# resolves at build time. The ``fluent-bundle`` (Apache-2.0, Mozilla)
# complements it for runtime-composed strings that need ICU-style plurals
# / select / select-ordinal — e.g. updater progress "{n, plural, one {# minute
# remaining} other {# minutes remaining}}" where ``n`` only exists at runtime.
rust-i18n = "4"
fluent-bundle = "0.16"
unic-langid = "0.9"
# FU-037 (2026-05-10): ``devtools`` flips on the WebKit inspector in
# release builds too — right-click → Inspect Element opens devtools so
# the user can read the console, set breakpoints, and grab a stack
# without rebuilding the app with ``cargo tauri dev``. We pair this
# with the per-tab ``ErrorBoundary`` so JS exceptions stay recoverable
# AND inspectable.
tauri = { version = "~2.11.0", features = ["devtools"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: we need the Job Objects API + Threading handles to assign
# spawned child processes to a kill-on-close job. That's the only way
# to guarantee llama-server grandchildren die when Tauri does, even
# on hard kills (Task Manager's End Task, OOM killer, process crash).
# windows-sys 0.61 is already in the tree transitively via Tauri; we
# add an explicit dep so we can name the features we need.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",       # HANDLE, CloseHandle
    "Win32_System_JobObjects", # CreateJobObjectW, SetInformationJobObject,
                                # AssignProcessToJobObject, JOBOBJECT_EXTENDED_LIMIT_INFORMATION
] }
